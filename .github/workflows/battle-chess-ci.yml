name: Battle Chess Godot 4.7.2

concurrency:
  group: battle-chess-revival-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "battle-chess-revival", "battle-chess-g7", "battle-chess-g7-ai" ]
    paths:
      - "battle-chess-revival/**"
      - ".github/workflows/battle-chess-ci.yml"
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip xvfb libgl1 python3-pil python3-numpy python3-pip
      - name: Download Blender 5.2.2 LTS
        run: |
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -O blender.tar.xz
          tar -xf blender.tar.xz
          mv blender-5.2.2-linux-x64 blender-5.2.2
          ./blender-5.2.2/blender --version
      - name: Build production mesh assets
        run: |
          python3 -m pip install --user --quiet trimesh
          python3 battle-chess-revival/tools/generate_mesh_assets.py
          mkdir -p battle-chess-revival/.generated
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_pawns_v2_source.py -- --output battle-chess-revival/.generated/pawns_v2_source.blend
          ./blender-5.2.2/blender --background battle-chess-revival/.generated/pawns_v2_source.blend --python battle-chess-revival/tools/blender/rig_pawn_v2.py -- --side white --output battle-chess-revival/assets/models/white_pawn_production_v1.glb
          ./blender-5.2.2/blender --background battle-chess-revival/.generated/pawns_v2_source.blend --python battle-chess-revival/tools/blender/rig_pawn_v2.py -- --side black --output battle-chess-revival/assets/models/black_pawn_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_knights_v1.py -- --white-output battle-chess-revival/assets/models/white_knight_production_v1.glb --black-output battle-chess-revival/assets/models/black_knight_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_knights_v1.py -- --side white --input battle-chess-revival/assets/models/white_knight_production_v1.glb --output battle-chess-revival/assets/models/white_knight_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_knights_v1.py -- --side black --input battle-chess-revival/assets/models/black_knight_production_v1.glb --output battle-chess-revival/assets/models/black_knight_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_bishops_v1.py -- --white-output battle-chess-revival/assets/models/white_bishop_production_v1.glb --black-output battle-chess-revival/assets/models/black_bishop_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_bishops_v1.py -- --side white --input battle-chess-revival/assets/models/white_bishop_production_v1.glb --output battle-chess-revival/assets/models/white_bishop_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_bishops_v1.py -- --side black --input battle-chess-revival/assets/models/black_bishop_production_v1.glb --output battle-chess-revival/assets/models/black_bishop_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_rooks_v1.py -- --white-output battle-chess-revival/assets/models/white_rook_production_v1.glb --black-output battle-chess-revival/assets/models/black_rook_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_rooks_v1.py -- --side white --input battle-chess-revival/assets/models/white_rook_production_v1.glb --output battle-chess-revival/assets/models/white_rook_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_rooks_v1.py -- --side black --input battle-chess-revival/assets/models/black_rook_production_v1.glb --output battle-chess-revival/assets/models/black_rook_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_queens_v1.py -- --white-output battle-chess-revival/assets/models/white_queen_production_v1.glb --black-output battle-chess-revival/assets/models/black_queen_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_queens_v1.py -- --side white --input battle-chess-revival/assets/models/white_queen_production_v1.glb --output battle-chess-revival/assets/models/white_queen_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_queens_v1.py -- --side black --input battle-chess-revival/assets/models/black_queen_production_v1.glb --output battle-chess-revival/assets/models/black_queen_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_kings_v1.py -- --white-output battle-chess-revival/assets/models/white_king_production_v1.glb --black-output battle-chess-revival/assets/models/black_king_production_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_kings_v1.py -- --side white --input battle-chess-revival/assets/models/white_king_production_v1.glb --output battle-chess-revival/assets/models/white_king_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/rig_kings_v1.py -- --side black --input battle-chess-revival/assets/models/black_king_production_v1.glb --output battle-chess-revival/assets/models/black_king_rigged_v1.glb
          ./blender-5.2.2/blender --background --python battle-chess-revival/tools/blender/build_cathedral_v1.py -- --output battle-chess-revival/assets/models/cathedral_production_v1.glb
          test -s battle-chess-revival/assets/models/white_pawn_production_v1.glb
          test -s battle-chess-revival/assets/models/black_pawn_production_v1.glb
          test -s battle-chess-revival/assets/models/white_knight_production_v1.glb
          test -s battle-chess-revival/assets/models/black_knight_production_v1.glb
          test -s battle-chess-revival/assets/models/white_knight_rigged_v1.glb
          test -s battle-chess-revival/assets/models/black_knight_rigged_v1.glb
          test -s battle-chess-revival/assets/models/white_bishop_production_v1.glb
          test -s battle-chess-revival/assets/models/black_bishop_production_v1.glb
          test -s battle-chess-revival/assets/models/white_bishop_rigged_v1.glb
          test -s battle-chess-revival/assets/models/black_bishop_rigged_v1.glb
          test -s battle-chess-revival/assets/models/white_rook_production_v1.glb
          test -s battle-chess-revival/assets/models/black_rook_production_v1.glb
          test -s battle-chess-revival/assets/models/white_rook_rigged_v1.glb
          test -s battle-chess-revival/assets/models/black_rook_rigged_v1.glb
          test -s battle-chess-revival/assets/models/white_queen_production_v1.glb
          test -s battle-chess-revival/assets/models/black_queen_production_v1.glb
          test -s battle-chess-revival/assets/models/white_queen_rigged_v1.glb
          test -s battle-chess-revival/assets/models/black_queen_rigged_v1.glb
          test -s battle-chess-revival/assets/models/white_king_production_v1.glb
          test -s battle-chess-revival/assets/models/black_king_production_v1.glb
          test -s battle-chess-revival/assets/models/white_king_rigged_v1.glb
          test -s battle-chess-revival/assets/models/black_king_rigged_v1.glb
          test -s battle-chess-revival/assets/models/cathedral_production_v1.glb
          rm -rf battle-chess-revival/.generated
      - name: Build production audio assets
        run: |
          python3 battle-chess-revival/tools/audio/build_audio_v1.py --output battle-chess-revival/assets/audio
          test -s battle-chess-revival/assets/audio/cathedral_ambience.wav
          test -s battle-chess-revival/assets/audio/ui_select.wav
          test -s battle-chess-revival/assets/audio/move.wav
          test -s battle-chess-revival/assets/audio/check.wav
          test -s battle-chess-revival/assets/audio/checkmate.wav
          test -s battle-chess-revival/assets/audio/impact_pawn.wav
          test -s battle-chess-revival/assets/audio/impact_knight.wav
          test -s battle-chess-revival/assets/audio/impact_bishop.wav
          test -s battle-chess-revival/assets/audio/impact_rook.wav
          test -s battle-chess-revival/assets/audio/impact_queen.wav
          test -s battle-chess-revival/assets/audio/impact_king.wav
      - name: Validate concept asset contracts
        run: python3 battle-chess-revival/tools/validate_asset_contracts.py
      - name: Download Godot 4.7.2 stable
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import and parse project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --editor --quit-after 30
      - name: Validate production UI and pause flow
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/ui_smoke_test.gd
      - name: Validate tactical board feedback
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/tactical_feedback_test.gd
      - name: Validate persistent player settings
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/settings_persistence_test.gd
      - name: Validate production audio routing
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/audio_smoke_test.gd
      - name: Validate cinematic capture modes
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/capture_mode_test.gd
      - name: Validate final presentation and rematch flow
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/presentation_smoke_test.gd
      - name: Validate release candidate audit
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/release_audit.gd
      - name: Validate production cathedral asset
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/cathedral_asset_test.gd
      - name: Validate authored Knight rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/knight_rig_test.gd
      - name: Validate Knight runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/knight_runtime_animation_test.gd
      - name: Validate authored Bishop rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/bishop_rig_test.gd
      - name: Validate Bishop runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/bishop_runtime_animation_test.gd
      - name: Validate authored Rook rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/rook_rig_test.gd
      - name: Validate Rook runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/rook_runtime_animation_test.gd
      - name: Validate authored Queen rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/queen_rig_test.gd
      - name: Validate Queen runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/queen_runtime_animation_test.gd
      - name: Validate authored King rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/king_rig_test.gd
      - name: Validate King runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/king_runtime_animation_test.gd
      - name: Validate unified Pawn rig assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/pawn_rig_test.gd
      - name: Validate Pawn runtime authored animation wiring
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/pawn_runtime_animation_test.gd
      - name: Validate authored secondary motion layer
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/secondary_motion_test.gd
      - name: Validate strategic AI and difficulty levels
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/ai_strategy_test.gd
      - name: Validate move history and undo
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/history_undo_test.gd
      - name: Validate interactive pawn promotion flow
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/promotion_flow_test.gd
      - name: Run chess rules tests
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/chess_rules_test.gd
      - name: Run capture smoke tests
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/smoke_test.gd
      - name: Render pawn production review
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/pawn_asset_review.gd
      - name: Render gameplay reference frame
        run: xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path battle-chess-revival --script res://scripts/tests/render_capture.gd
      - name: Build capture animation contact sheet
        run: python3 battle-chess-revival/tools/make_capture_contact_sheet.py
      - name: Visual QA against approved video reference
        run: |
          python3 battle-chess-revival/tools/visual_qa.py --gameplay battle-chess-revival/gameplay_reference.png --battle battle-chess-revival/battle_reference.png --profile battle-chess-revival/visual_refs/reference_profile.json --baseline battle-chess-revival/visual_refs/baseline.json --out battle-chess-revival/visual_report --regression-tolerance 0.04
          cat battle-chess-revival/visual_report/report.md
      - name: Package Godot project
        run: |
          zip -qr BattleChessRevival-Godot-4.7.2.zip battle-chess-revival \
            -x 'battle-chess-revival/gameplay_reference.png' \
               'battle-chess-revival/battle_reference.png' \
               'battle-chess-revival/capture_*.png' \
               'battle-chess-revival/asset_lineup_*.png' \
               'battle-chess-revival/asset_review_*.png' \
               'battle-chess-revival/capture_contact_sheet.png' \
               'battle-chess-revival/visual_report/*'
      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Godot-4.7.2
          path: BattleChessRevival-Godot-4.7.2.zip
          if-no-files-found: error
      - name: Install Windows export templates
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -f export_templates.tpz
          for attempt in 1 2 3 4 5; do
            echo "Export template download attempt $attempt/5"
            if curl -fL --retry 2 --retry-delay 2 --retry-all-errors "$TEMPLATE_URL" -o export_templates.tpz && test -s export_templates.tpz; then
              break
            fi
            rm -f export_templates.tpz
            sleep $((attempt * 3))
          done
          test -s export_templates.tpz
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q export_templates.tpz -d /tmp/godot_export_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot_export_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"
      - name: Export Windows x86_64 release candidate
        run: |
          mkdir -p battle-chess-revival/build/windows
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path battle-chess-revival --export-release "Windows Desktop" build/windows/BattleChessRevival.exe
          test -s battle-chess-revival/build/windows/BattleChessRevival.exe
          python3 - <<'PY'
          from pathlib import Path
          exe = Path("battle-chess-revival/build/windows/BattleChessRevival.exe")
          size = exe.stat().st_size
          print("WINDOWS_EXPORT_PASS bytes=", size)
          if size < 10_000_000 or size > 250_000_000:
              raise SystemExit("unexpected Windows executable size")
          PY
          cp battle-chess-revival/RELEASE_README.txt battle-chess-revival/build/windows/README.txt
          (cd battle-chess-revival/build/windows && zip -q ../../../BattleChessRevival-Windows-x86_64.zip BattleChessRevival.exe README.txt)
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Windows-x86_64
          path: BattleChessRevival-Windows-x86_64.zip
          if-no-files-found: error
      - name: Upload gameplay render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Visual-References
          path: |
            battle-chess-revival/gameplay_reference.png
            battle-chess-revival/battle_reference.png
            battle-chess-revival/capture_*.png
            battle-chess-revival/asset_lineup_*.png
            battle-chess-revival/asset_review_*.png
            battle-chess-revival/capture_pawn.png
            battle-chess-revival/capture_knight.png
            battle-chess-revival/capture_bishop.png
            battle-chess-revival/capture_rook.png
            battle-chess-revival/capture_queen.png
            battle-chess-revival/capture_king.png
            battle-chess-revival/capture_contact_sheet.png
          if-no-files-found: error
      - name: Upload Visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Visual-QA
          path: battle-chess-revival/visual_report
          if-no-files-found: error
