name: Battle Chess Godot 4.7.2

on:
  push:
    branches: [ "battle-chess-revival" ]
    paths:
      - "battle-chess-revival/**"
      - ".github/workflows/battle-chess-ci.yml"
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip xvfb libgl1 python3-pil python3-numpy python3-pip

      - name: Build production mesh assets
        run: |
          python3 -m pip install --user --quiet trimesh
          python3 battle-chess-revival/tools/generate_mesh_assets.py
          test -s battle-chess-revival/assets/models/white_pawn_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_pawn_concept_v3.glb
          test -s battle-chess-revival/assets/models/white_knight_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_knight_concept_v3.glb
          test -s battle-chess-revival/assets/models/white_bishop_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_bishop_concept_v3.glb
          test -s battle-chess-revival/assets/models/white_rook_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_rook_concept_v3.glb
          test -s battle-chess-revival/assets/models/white_queen_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_queen_concept_v3.glb
          test -s battle-chess-revival/assets/models/white_king_concept_v3.glb
          test -s battle-chess-revival/assets/models/black_king_concept_v3.glb

      - name: Validate concept asset contracts
        run: |
          python3 battle-chess-revival/tools/validate_asset_contracts.py

      - name: Download Godot 4.7.2 stable
        run: |
          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import and parse project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --rendering-method gl_compatibility \
            --path battle-chess-revival \
            --editor \
            --quit-after 5

      - name: Run chess rules tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --rendering-method gl_compatibility \
            --path battle-chess-revival \
            --script res://scripts/tests/chess_rules_test.gd

      - name: Run capture smoke tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --rendering-method gl_compatibility \
            --path battle-chess-revival \
            --script res://scripts/tests/smoke_test.gd

      - name: Render gameplay reference frame
        run: |
          xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 \
            --rendering-method gl_compatibility \
            --path battle-chess-revival \
            --script res://scripts/tests/render_capture.gd

      - name: Build capture animation contact sheet
        run: |
          python3 battle-chess-revival/tools/make_capture_contact_sheet.py

      - name: Visual QA against approved video reference
        run: |
          python3 battle-chess-revival/tools/visual_qa.py \
            --gameplay battle-chess-revival/gameplay_reference.png \
            --battle battle-chess-revival/battle_reference.png \
            --profile battle-chess-revival/visual_refs/reference_profile.json \
            --baseline battle-chess-revival/visual_refs/baseline.json \
            --out battle-chess-revival/visual_report \
            --regression-tolerance 0.04
          cat battle-chess-revival/visual_report/report.md

      - name: Package Godot project
        run: |
          zip -qr BattleChessRevival-Godot-4.7.2.zip battle-chess-revival

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Godot-4.7.2
          path: BattleChessRevival-Godot-4.7.2.zip
          if-no-files-found: error

      - name: Upload gameplay render
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Visual-References
          path: |
            battle-chess-revival/gameplay_reference.png
            battle-chess-revival/battle_reference.png
            battle-chess-revival/capture_*.png
            battle-chess-revival/asset_lineup_*.png
            battle-chess-revival/capture_pawn.png
            battle-chess-revival/capture_knight.png
            battle-chess-revival/capture_bishop.png
            battle-chess-revival/capture_rook.png
            battle-chess-revival/capture_queen.png
            battle-chess-revival/capture_king.png
            battle-chess-revival/capture_contact_sheet.png
          if-no-files-found: error


      - name: Upload Visual QA report
        uses: actions/upload-artifact@v4
        with:
          name: BattleChessRevival-Visual-QA
          path: battle-chess-revival/visual_report
          if-no-files-found: error
